let proximaLojaCompartilhada=2;

 const nomes=LOJAS.filter(l=>!l.nome.includes("temporariamente fechada")).map(l=>`<option value="${safe(l.nome)}">${safe(l.nome)}</option>`).join("");

function gerarPaletesExtras(sec){
 const e=sec.querySelector('.paletes-extra'),n=Number(sec.querySelector('.qtd-extra').value);

 e.innerHTML=Array.from({length:n},(_,i)=>`<div class="item pallet" style="background:#fff;color:#111;border:1px solid #d6e7da"><b>Palete ${i+1}</b><div class="notas-extra">${(old[i]||['']).map(v=>`<div class="field"><label>Nota fiscal *</label><input class="nf-extra" required value="${safe(v)}" placeholder="Número da nota fiscal"></div>`).join('')}</div><button type="button" class="alt" onclick="adicionarNotaExtra(this)">＋ Nota fiscal</button></div>`).join('');
}

function gerarPaletes(){let e=$("paletes"),n=Number($("qtdPaletes").value);if(!Number.isInteger(n)||n<1||n>200){e.innerHTML="";return}let anterior=[...e.querySelectorAll(".pallet")].map(p=>[...p.querySelectorAll(".nf")].map(i=>i.value));e.innerHTML="";for(let i=1;i<=n;i++){addPalete();let inputs=e.children[i-1].querySelectorAll(".nf");if(anterior[i-1]){anterior[i-1].forEach((v,j)=>{if(j>0)e.children[i-1].querySelector("button.alt").click();});e.children[i-1].querySelectorAll(".nf").forEach((el,j)=>el.value=anterior[i-1][j]||"")}}}

const nomesLojas=new Set([$("loja").value]);
const notasVistas=new Set(all);
for(const sec of document.querySelectorAll('#lojasAdicionais .loja-compartilhada')){

 document.body.classList.remove("print-crachas","print-romaneio","print-juntos");
 document.body.classList.add(tipo==="juntos"?"print-juntos":tipo==="crachas"?"print-crachas":"print-romaneio");
 pages.forEach(el=>{el.style.display=tipo==="juntos"?(el.classList.contains("pallet-sheet")?"flex":"block"):tipo==="crachas"?(el.classList.contains("pallet-sheet")?"flex":"none"):(el.classList.contains("driver-sheet")?"block":"none")});
 const restore=()=>{pages.forEach(el=>el.style.display="");document.body.classList.remove("print-crachas","print-romaneio","print-juntos");window.removeEventListener("afterprint",restore)};
 window.addEventListener("afterprint",restore);
 requestAnimationFrame(()=>setTimeout(()=>{window.print();setTimeout(restore,1500)},200));
}
function exportarBackup(){
 if(window.RomaneioAndroid){RomaneioAndroid.saveBackup(JSON.stringify({versao:1,exportado:new Date().toISOString(),cargas:db},null,2));return;}
 const blob=new Blob([JSON.stringify({versao:1,exportado:new Date().toISOString(),cargas:db},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hiperideal_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function importarBackup(input){
 const file=input.files?.[0];if(!file)return;
 if(file.size>16*1024*1024){input.value="";alert("Backup maior que o limite de 16 MB.");return;}
 try{const data=JSON.parse(await file.text());if(!Array.isArray(data.cargas)||!data.cargas.every(x=>x.id&&x.loja&&Array.isArray(x.paletes)&&Array.isArray(x.conferidos)))throw Error("Formato inválido");
 if(!confirm("Substituir todos os registros locais pelo backup selecionado?"))return;
 const old=db;db=data.cargas;if(!save()){db=old;return}selected=null;nav("painel");alert("Backup importado com sucesso.");
 }catch(e){alert("Falha ao importar: "+e.message)}
}
window.addEventListener("storage",event=>{if(event.key===KEY){try{const newer=JSON.parse(event.newValue||"[]");if(Array.isArray(newer)){const lojaAtual=$("lojaFiltro")?.value;db=newer;render();if(page==="loja"&&lojaAtual)renderLoja(lojaAtual)}}catch(e){}}});
window.addEventListener("popstate",()=>nav(location.pathname.split("/")[2]||"inicio"));
nav(window.ROMANEIO_CONTEXT.initialPage);
</script></body></html>
